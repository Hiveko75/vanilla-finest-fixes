# Vanilla Finest Helper: the mod versions each module was made and tested for (Minecraft 26.1.2).
# A module only runs with its mod in one of these versions; with another version it stays off and
# the log says so. Compared with the number part of the mod's version ("1.6.10" for "1.6.10-26.3");
# "1.11.*" accepts any 1.11.x. Modules that change a mod's code or work around a bug of one version
# list that exact version; modules that only read a mod's settings by name accept the minor version.
iris=1.11.*
betterclouds=1.13.*
elytratrails=1.5.1
touch_n_motion=1.0.5
# Folders module: Flashback's replay folder (redirects Flashback.getReplayFolder; off with Flashback Settings)
flashback=0.43.3
# Folders module: Axiom's blueprint folder (writes Axiom's own "blueprint.customPath" setting by name)
axiom=6.1.*
