# Vanilla Finest Fixes: the mod versions each module was made and tested for (Minecraft 26.3).
# A module only runs with its mod in one of these versions; with another version it stays off and
# the log says so. Compared with the number part of the mod's version ("1.6.10" for "1.6.10-26.3");
# "1.11.*" accepts any 1.11.x. Modules that change a mod's code or work around a bug of one version
# list that exact version; modules that only read a mod's settings by name accept the minor version.
# Improved Transparency restore (reads Iris' shader setting by name)
iris=1.11.*
# enchantment glint crash fix (bug in Iris 1.11.7)
iris.glint=1.11.7
# Better Clouds module (reads its settings by name)
betterclouds=1.15.*
# Voxy module (patches Voxy's start-up and its shader pack patches)
voxy=0.2.20
# Elytra Contrails module (patches its trail sampling)
elytratrails=1.6.10
# Touch'n Motion module (bug in 1.0.5)
touch_n_motion=1.0.5
# Atmospherics module (AirHaze crash with Improved Transparency in 2.6.8)
atmospherics=2.6.8
# Enchanted's Sodium Options module (draws its tooltips through Minecraft's own tooltip code)
enchanteds_sodium_options=1.4.1
# Immersive Storms module (smaller sandstorm grains)
immersive-storms=1.8.0
