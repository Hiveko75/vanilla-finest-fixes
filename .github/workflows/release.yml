# Builds every jar and publishes them as a GitHub release, with the version's section of
# CHANGELOG.md as the notes. Run from the Actions tab: Release -> Run workflow
# (the tag defaults to mod_version from gradle.properties).
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (empty = mod_version from gradle.properties)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 21 and 25
        uses: actions/setup-java@v4
        with:
          java-version: |
            21
            25
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        run: |
          chmod +x ./gradlew
          mkdir dist
          for mc in 26.3 26.2 26.1.2; do
            ./gradlew clean build -Pmc=$mc --stacktrace
            cp build/libs/*+mc$mc.jar dist/
          done
          for mc in 1.21.11 1.21.1; do
            ./gradlew -p mc$mc build --stacktrace
            cp mc$mc/build/libs/*+mc$mc.jar dist/
          done
          ls -l dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG="$VERSION"
          # Notes: the "## <version>" section of CHANGELOG.md
          awk -v v="$VERSION" '/^## /{f = (index($0, "## " v " ") == 1 || $0 == "## " v)} f' CHANGELOG.md | tail -n +2 > notes.md
          [ -s notes.md ] || { echo "No CHANGELOG section for $VERSION"; exit 1; }
          gh release create "$TAG" dist/*.jar --target "$GITHUB_SHA" --title "Vanilla Finest Fixes $TAG" --notes-file notes.md
